version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sales_management}
      MYSQL_USER: ${MYSQL_USER:-sms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sms_password123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sms_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sms_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-sms_user}:${MYSQL_PASSWORD:-sms_password123}@mysql:3306/${MYSQL_DATABASE:-sales_management}
      JWT_SECRET: ${JWT_SECRET:-hosho-sales-mgmt-jwt-secret-2026-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 480
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80}
      APP_ENV: production
      APP_DEBUG: "false"
    ports:
      - "8000:8000"
    networks:
      - sms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://sales-management-system-hosho.onrender.com/api/v1}
    container_name: sms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - sms_network

volumes:
  mysql_data:
    driver: local

networks:
  sms_network:
    driver: bridge
